name: Fitmint
description: Fitmint is a mobile move-to-earn fitness application from Rabbit Technologies
  Inc that gamifies everyday walking. Users set daily step goals, level up, open mystery
  boxes, and earn an in-app currency called $GRIT that can be redeemed for Amazon and
  other gift cards. The app layers social features such as leaderboards, challenges,
  and streaks on top of activity tracking to help people build a lifelong habit of
  walking. Fitmint is a consumer mobile app and does not currently publish a public
  developer API, SDK, or developer portal; this record is maintained in the API Evangelist
  network as a company/provider profile and was surfaced as a portfolio company of
  General Catalyst.
